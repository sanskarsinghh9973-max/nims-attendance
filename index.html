          <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NIMS Attendance</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#071b15;
    color:#eee;
}

header{
    padding:18px;
    text-align:center;
    background:#102820;
    border-bottom:1px solid #385449;
}

header h1{
    margin:0;
    color:#e0a855;
}

.container{
    max-width:900px;
    margin:auto;
    padding:18px;
}

.tabs{
    display:flex;
    gap:8px;
    margin-bottom:18px;
}

.tabs button{
    flex:1;
    padding:14px 8px;
    border:0;
    border-radius:10px;
    background:#172e26;
    color:white;
    font-size:16px;
}

.tabs button.active{
    background:#d8953d;
    color:#111;
    font-weight:bold;
}

.card{
    background:#10251e;
    border:1px solid #385449;
    border-radius:15px;
    padding:18px;
    margin-bottom:18px;
}

h2{
    color:#e0a855;
    margin-top:0;
}

input,select{
    width:100%;
    padding:13px;
    margin:7px 0;
    border-radius:8px;
    border:1px solid #45675a;
    background:#1d3830;
    color:white;
    font-size:16px;
}

button{
    cursor:pointer;
}

.main-btn{
    width:100%;
    padding:14px;
    border:0;
    border-radius:9px;
    background:#d8953d;
    color:#111;
    font-weight:bold;
    font-size:16px;
    margin-top:8px;
}

.secondary{
    background:#24483b;
    color:white;
}

.danger{
    background:#9d3939;
    color:white;
}

.camera-box{
    width:100%;
    max-width:500px;
    margin:10px auto;
    background:#000;
    border-radius:12px;
    overflow:hidden;
}

video,canvas{
    width:100%;
    display:block;
}

canvas{
    display:none;
}

.status{
    padding:12px;
    border-radius:8px;
    margin:10px 0;
    background:#17352b;
}

.person{
    background:#19332b;
    border:1px solid #36584c;
    padding:13px;
    border-radius:10px;
    margin:8px 0;
}

.person strong{
    color:#e0a855;
}

.record{
    background:#19332b;
    border:1px solid #36584c;
    border-radius:10px;
    padding:13px;
    margin:8px 0;
}

.ok{
    color:#70d58d;
    font-weight:bold;
}

.no{
    color:#ff7777;
    font-weight:bold;
}

.small{
    font-size:13px;
    color:#aaa;
}

.hidden{
    display:none;
}

table{
    width:100%;
    border-collapse:collapse;
    margin-top:10px;
}

th,td{
    border:1px solid #3a554c;
    padding:8px;
    text-align:left;
    font-size:13px;
}

th{
    color:#e0a855;
    background:#173229;
}

@media(max-width:600px){
    .container{padding:10px}
    header h1{font-size:22px}
}
</style>
</head>

<body>

<header>
    <h1>NIMS Attendance</h1>
    <div class="small">Attendance Management System</div>
</header>

<div class="container">

<div class="tabs">
    <button id="tabRegister" class="active" onclick="showTab('register')">
        Register
    </button>

    <button id="tabPunch" onclick="showTab('punch')">
        Punch In
    </button>

    <button id="tabReport" onclick="showTab('report')">
        Report
    </button>
</div>


<!-- REGISTER -->
<section id="registerSection">

<div class="card">

<h2>New Person Register</h2>

<input
    id="personName"
    type="text"
    placeholder="Enter person's name"
>

<div class="camera-box">
    <video id="registerVideo" autoplay playsinline></video>
    <canvas id="registerCanvas"></canvas>
</div>

<button class="main-btn secondary" onclick="startRegisterCamera()">
    📷 Start Camera
</button>

<button class="main-btn" onclick="captureRegistration()">
    📸 Capture & Register
</button>

<div id="registerStatus" class="status">
    Camera not started.
</div>

</div>


<div class="card">

<h2>Registered People</h2>

<div id="peopleList"></div>

</div>

</section>



<!-- PUNCH -->
<section id="punchSection" class="hidden">

<div class="card">

<h2>Attendance Punch</h2>

<select id="personSelect">
    <option value="">Select person</option>
</select>

<div class="camera-box">
    <video id="punchVideo" autoplay playsinline></video>
    <canvas id="punchCanvas"></canvas>
</div>

<button class="main-btn secondary" onclick="startPunchCamera()">
    📷 Start Camera
</button>

<button class="main-btn" onclick="punchIn()">
    🟢 Punch In
</button>

<button class="main-btn secondary" onclick="punchOut()">
    🔴 Punch Out
</button>

<div id="punchStatus" class="status">
    Select a person.
</div>

</div>


<div class="card">

<h2>Today's Attendance</h2>

<div id="todayList"></div>

</div>

</section>



<!-- REPORT -->
<section id="reportSection" class="hidden">

<div class="card">

<h2>Attendance Report</h2>

<input id="reportDate" type="date">

<select id="reportPerson">
    <option value="">All People</option>
</select>

<button class="main-btn" onclick="generateReport()">
    🔎 Generate Report
</button>

<button class="main-btn secondary" onclick="exportCSV()">
    📥 Export CSV
</button>

</div>


<div class="card">

<h2>Report</h2>

<div id="reportOutput"></div>

</div>

</section>

</div>


<script>

let registerStream = null;
let punchStream = null;


/* =========================
   DATABASE
========================= */

function getPeople(){
    return JSON.parse(localStorage.getItem("nims_people") || "[]");
}

function savePeople(data){
    localStorage.setItem("nims_people", JSON.stringify(data));
}

function getAttendance(){
    return JSON.parse(localStorage.getItem("nims_attendance") || "[]");
}

function saveAttendance(data){
    localStorage.setItem("nims_attendance", JSON.stringify(data));
}


/* =========================
   TAB SYSTEM
========================= */

function showTab(tab){

    document.getElementById("registerSection")
        .classList.add("hidden");

    document.getElementById("punchSection")
        .classList.add("hidden");

    document.getElementById("reportSection")
        .classList.add("hidden");

    document.getElementById("tabRegister")
        .classList.remove("active");

    document.getElementById("tabPunch")
        .classList.remove("active");

    document.getElementById("tabReport")
        .classList.remove("active");


    if(tab === "register"){

        document.getElementById("registerSection")
            .classList.remove("hidden");

        document.getElementById("tabRegister")
            .classList.add("active");

    }

    if(tab === "punch"){

        document.getElementById("punchSection")
            .classList.remove("hidden");

        document.getElementById("tabPunch")
            .classList.add("active");

        updatePersonSelect();
        updateToday();

    }

    if(tab === "report"){

        document.getElementById("reportSection")
            .classList.remove("hidden");

        document.getElementById("tabReport")
            .classList.add("active");

        updateReportPeople();

    }
}


/* =========================
   CAMERA
========================= */

async function startRegisterCamera(){

    try{

        if(registerStream){
            registerStream.getTracks().forEach(t=>t.stop());
        }

        registerStream =
            await navigator.mediaDevices.getUserMedia({
                video:{
                    facingMode:"user"
                },
                audio:false
            });

        document.getElementById("registerVideo")
            .srcObject = registerStream;

        document.getElementById("registerStatus")
            .innerText = "Camera is ON. Look at the camera.";

    }catch(error){

        document.getElementById("registerStatus")
            .innerText =
            "Camera permission nahi mili. Browser camera permission Allow karein.";

        console.error(error);
    }
}


async function startPunchCamera(){

    try{

        if(punchStream){
            punchStream.getTracks().forEach(t=>t.stop());
        }

        punchStream =
            await navigator.mediaDevices.getUserMedia({
                video:{
                    facingMode:"user"
                },
                audio:false
            });

        document.getElementById("punchVideo")
            .srcObject = punchStream;

        document.getElementById("punchStatus")
            .innerText = "Camera is ON.";

    }catch(error){

        document.getElementById("punchStatus")
            .innerText =
            "Camera permission Allow karein.";

        console.error(error);
    }
}


/* =========================
   PHOTO CAPTURE
========================= */

function captureVideo(video,canvas){

    if(!video.srcObject){

        alert("Pehle Start Camera dabayein.");
        return null;
    }

    canvas.width = video.videoWidth || 640;
    canvas.height = video.videoHeight || 480;

    let ctx = canvas.getContext("2d");

    ctx.drawImage(
        video,
        0,
        0,
        canvas.width,
        canvas.height
    );

    return canvas.toDataURL(
        "image/jpeg",
        0.75
    );
}


/* =========================
   REGISTER
========================= */

function captureRegistration(){

    let name =
        document.getElementById("personName")
            .value.trim();

    if(!name){

        alert("Pehle naam enter karein.");
        return;
    }

    let photo =
        captureVideo(
            document.getElementById("registerVideo"),
            document.getElementById("registerCanvas")
        );

    if(!photo){
        return;
    }

    let people = getPeople();

    let exists =
        people.some(
            p => p.name.toLowerCase() === name.toLowerCase()
        );

    if(exists){

        alert("Ye naam already registered hai.");
        return;
    }

    let person = {

        id: "P" + Date.now(),

        name: name,

        photo: photo,

        registeredAt:
            new Date().toISOString()

    };

    people.push(person);

    savePeople(people);

    document.getElementById("personName").value = "";

    document.getElementById("registerStatus")
        .innerText =
        name + " successfully registered.";

    renderPeople();

    updatePersonSelect();
}


/* =========================
   DISPLAY PEOPLE
========================= */

function renderPeople(){

    let people = getPeople();

    let box =
        document.getElementById("peopleList");

    if(people.length === 0){

        box.innerHTML =
            '<div class="small">No person registered.</div>';

        return;
    }

    box.innerHTML = "";

    people.forEach(person => {

        let div =
            document.createElement("div");

        div.className = "person";

        div.innerHTML = `
            <strong>${escapeHTML(person.name)}</strong>
            <div class="small">
                Registered:
                ${formatDateTime(person.registeredAt)}
            </div>

            <button
                class="main-btn danger"
                onclick="deletePerson('${person.id}')">
                Delete
            </button>
        `;

        box.appendChild(div);

    });
}


function deletePerson(id){

    if(!confirm("Is person ko delete karna hai?")){
        return;
    }

    let people =
        getPeople().filter(p => p.id !== id);

    savePeople(people);

    renderPeople();
    updatePersonSelect();
    updateReportPeople();
}


/* =========================
   SELECT PEOPLE
========================= */

function updatePersonSelect(){

    let people = getPeople();

    let select =
        document.getElementById("personSelect");

    select.innerHTML =
        '<option value="">Select person</option>';

    people.forEach(person => {

        let option =
            document.createElement("option");

        option.value = person.id;
        option.textContent = person.name;

        select.appendChild(option);

    });
}


function updateReportPeople(){

    let people = getPeople();

    let select =
        document.getElementById("reportPerson");

    select.innerHTML =
        '<option value="">All People</option>';

    people.forEach(person => {

        let option =
            document.createElement("option");

        option.value = person.id;
        option.textContent = person.name;

        select.appendChild(option);

    });
}


/* =========================
   PUNCH IN
========================= */

function punchIn(){

    let personId =
        document.getElementById("personSelect")
            .value;

    if(!personId){

        alert("Person select karein.");
        return;
    }

    let people = getPeople();

    let person =
        people.find(p => p.id === personId);

    if(!person){
        return;
    }

    let attendance = getAttendance();

    let today = getToday();

    let already =
        attendance.find(
            a =>
                a.personId === personId &&
                a.date === today &&
                !a.outTime
        );

    if(already){

        document.getElementById("punchStatus")
            .innerText =
            person.name +
            " already punched in.";

        return;
    }

    let now = new Date();

    let record = {

        id:"A" + Date.now(),

        personId:person.id,

        name:person.name,

        date:today,

        inTime:now.toISOString(),

        outTime:"",

        photo:""

    };

    let photo =
        captureVideo(
            document.getElementById("punchVideo"),
            document.getElementById("punchCanvas")
        );

    if(photo){
        record.photo = photo;
    }

    attendance.push(record);

    saveAttendance(attendance);

    document.getElementById("punchStatus")
        .innerHTML =
        '<span class="ok">✓ ' +
        escapeHTML(person.name) +
        ' — Punch In successful</span>';

    updateToday();
}


/* =========================
   PUNCH OUT
========================= */

function punchOut(){

    let personId =
        document.getElementById("personSelect")
            .value;

    if(!personId){

        alert("Person select karein.");
        return;
    }

    let attendance = getAttendance();

    let today = getToday();

    let record =
        attendance.find(
            a =>
                a.personId === personId &&
                a.date === today &&
                !a.outTime
        );

    if(!record){

        document.getElementById("punchStatus")
            .innerText =
            "Aaj ka active Punch In nahi mila.";

        return;
    }

    record.outTime =
        new Date().toISOString();

    saveAttendance(attendance);

    document.getElementById("punchStatus")
        .innerHTML =
        '<span class="ok">✓ ' +
        escapeHTML(record.name) +
        ' — Punch Out successful</span>';

    updateToday();
}


/* =========================
   TODAY
========================= */

function updateToday(){

    let attendance = getAttendance();

    let today = getToday();

    let records =
        attendance.filter(
            a => a.date === today
        );

    let box =
        document.getElementById("todayList");

    if(records.length === 0){

        box.innerHTML =
            '<div class="small">Aaj koi attendance nahi hai.</div>';

        return;
    }

    box.innerHTML = "";

    records.forEach(record => {

        let duration =
            calculateDuration(
                record.inTime,
                record.outTime
            );

        let div =
            document.createElement("div");

        div.className = "record";

        div.innerHTML = `

            <strong>
                ${escapeHTML(record.name)}
            </strong>

            <br>

            <span class="small">
                In:
                ${formatTime(record.inTime)}
            </span>

            <br>

            <span class="small">
                Out:
                ${
                    record.outTime
                    ? formatTime(record.outTime)
                    : "Not punched out"
                }
            </span>

            <br>

            <span class="small">
                Duration: ${duration}
            </span>

            <button
                class="main-btn danger"
                onclick="deleteAttendance('${record.id}')">
                Delete Record
            </button>
        `;

        box.appendChild(div);

    });
}


/* =========================
   DELETE ATTENDANCE
========================= */

function deleteAttendance(id){

    if(!confirm("Attendance record delete karein?")){
        return;
    }

    let attendance =
        getAttendance()
            .filter(a => a.id !== id);

    saveAttendance(attendance);

    updateToday();
}


/* =========================
   REPORT
========================= */

function generateReport(){

    let date =
        document.getElementById("reportDate")
            .value;

    let personId =
        document.getElementById("reportPerson")
            .value;

    let records = getAttendance();

    if(date){

        records =
            records.filter(
                r => r.date === date
            );
    }

    if(personId){

        records =
            records.filter(
                r => r.personId === personId
            );
    }

    let output =
        document.getElementById("reportOutput");

    if(records.length === 0){

        output.innerHTML =
            '<div class="small">No records found.</div>';

        return;
    }

    let html = `

    <div style="overflow-x:auto">

    <table>

    <tr>
        <th>Name</th>
        <th>Date</th>
        <th>In</th>
        <th>Out</th>
        <th>Duration</th>
    </tr>
    `;

    records.forEach(r => {

        html += `

        <tr>

            <td>${escapeHTML(r.name)}</td>

            <td>${r.date}</td>

            <td>${formatTime(r.inTime)}</td>

            <td>
                ${r.outTime
                    ? formatTime(r.outTime)
                    : "-"
                }
            </td>

            <td>
                ${calculateDuration(
                    r.inTime,
                    r.outTime
                )}
            </td>

        </tr>
        `;

    });

    html += `
    </table>
    </div>

    <p class="small">
        Total records: ${records.length}
    </p>
    `;

    output.innerHTML = html;
}


/* =========================
   CSV EXPORT
========================= */

function exportCSV(){

    let attendance = getAttendance();

    if(attendance.length === 0){

        alert("Export karne ke liye attendance nahi hai.");
        return;
    }

    let csv =
        "Name,Date,Punch In,Punch Out,Duration\n";

    attendance.forEach(r => {

        csv +=
            `"${csvSafe(r.name)}",` +
            `"${r.date}",` +
            `"${formatTime(r.inTime)}",` +
            `"${r.outTime ? formatTime(r.outTime) : ""}",` +
            `"${calculateDuration(r.inTime,r.outTime)}"\n`;

    });

    let blob =
        new Blob(
            [csv],
            {type:"text/csv;charset=utf-8;"}
        );

    let url =
        URL.createObjectURL(blob);

    let a =
        document.createElement("a");

    a.href = url;

    a.download =
        "NIMS_Attendance_" +
        getToday() +
        ".csv";

    document.body.appendChild(a);

    a.click();

    a.remove();

    URL.revokeObjectURL(url);
}


/* =========================
   DATE / TIME
========================= */

function getToday(){

    let d = new Date();

    let year = d.getFullYear();

    let month =
        String(d.getMonth()+1)
            .padStart(2,"0");

    let day =
        String(d.getDate())
            .padStart(2,"0");

    return year + "-" + month + "-" + day;
}


function formatTime(value){

    if(!value){
        return "-";
    }

    return new Date(value)
        .toLocaleTimeString(
            [],
            {
                hour:"2-digit",
                minute:"2-digit",
                second:"2-digit"
            }
        );
}


function formatDateTime(value){

    if(!value){
        return "-";
    }

    return new Date(value)
        .toLocaleString();
}


function calculateDuration(inTime,outTime){

    if(!inTime){
        return "-";
    }

    if(!outTime){
        return "Active";
    }

    let diff =
        new Date(outTime) -
        new Date(inTime);

    let seconds =
        Math.floor(diff / 1000);

    let hours =
        Math.floor(seconds / 3600);

    seconds %= 3600;

    let minutes =
        Math.floor(seconds / 60);

    seconds %= 60;

    return (
        String(hours).padStart(2,"0") +
        ":" +
        String(minutes).padStart(2,"0") +
        ":" +
        String(seconds).padStart(2,"0")
    );
}


/* =========================
   SECURITY / TEXT
========================= */

function escapeHTML(text){

    return String(text)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}


function csvSafe(text){

    return String(text)
        .replace(/"/g,'""');
}


/* =========================
   INITIAL LOAD
========================= */

document.addEventListener(
    "DOMContentLoaded",
    function(){

        renderPeople();

        updatePersonSelect();

        updateReportPeople();

        updateToday();

        document.getElementById("reportDate")
            .value = getToday();

    }
);

</script>

</body>
</html>
